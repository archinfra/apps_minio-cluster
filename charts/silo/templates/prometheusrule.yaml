{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "silo.fullname" . }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: silo.availability
      rules:
        - alert: SiloTargetDown
          expr: up{namespace="{{ .Release.Namespace }}",service="{{ include "silo.fullname" . }}"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SILO target is down"
            description: "Prometheus has been unable to scrape a SILO node for 5 minutes."
        - alert: SiloDiskOffline
          expr: minio_cluster_disk_offline_total{namespace="{{ .Release.Namespace }}"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "SILO reports offline disks"
            description: "At least one SILO disk has been offline for 5 minutes."
{{- end }}
