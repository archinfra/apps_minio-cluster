{{- if eq .Values.mode "distributed" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "silo.fullname" . }}-headless
  labels:
    {{- include "silo.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: {{ ternary "https" "http" .Values.tls.enabled }}
      port: {{ .Values.service.port }}
      targetPort: api
  selector:
    {{- include "silo.selectorLabels" . | nindent 4 }}
{{- end }}
