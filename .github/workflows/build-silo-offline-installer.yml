name: Build SILO Offline Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "VERSION"
      - "SILO_SOURCE.env"
      - "build-silo.sh"
      - "install-silo.sh"
      - "scripts/silo-mc-smoke.sh"
      - "charts/silo/**"
      - "images/silo-image-index.tsv"
      - "docs/SILO_BASELINE.md"
      - "docs/SILO_RELEASE_*.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/build-silo-offline-installer.yml"
  push:
    branches: [main, master]
    tags: ["silo-v*"]
    paths:
      - "VERSION"
      - "SILO_SOURCE.env"
      - "build-silo.sh"
      - "install-silo.sh"
      - "scripts/silo-mc-smoke.sh"
      - "charts/silo/**"
      - "images/silo-image-index.tsv"
      - "docs/SILO_BASELINE.md"
      - "docs/SILO_RELEASE_*.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/build-silo-offline-installer.yml"

permissions:
  contents: write

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n build-silo.sh
          bash -n install-silo.sh
          bash -n scripts/silo-mc-smoke.sh
      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Eq '^SILO_SOURCE_COMMIT=[0-9a-f]{40}$' SILO_SOURCE.env
          grep -q '^SILO_SECURITY_ADVISORY=SN-2026-011$' SILO_SOURCE.env
          chart_version="$(awk '$1 == "version:" { print $2; exit }' charts/silo/Chart.yaml)"
          test "${chart_version}" = "${version}"
          grep -Fqx "APP_VERSION=\"${version}\"" install-silo.sh
          test -f "docs/SILO_RELEASE_${version}.md"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "silo-v${version}"
          fi
      - name: Helm lint and render
        run: |
          helm lint charts/silo
          helm template silo charts/silo \
            --namespace aict \
            --set auth.existingSecret=silo-root-credentials \
            --set replicas=4 >/tmp/silo.yaml
          test -s /tmp/silo.yaml
          grep -q 'nodePort: 30095' /tmp/silo.yaml
          grep -q 'nodePort: 30092' /tmp/silo.yaml
          grep -q 'path: "/minio/metrics/v3"' /tmp/silo.yaml
          grep -q 'grafana_dashboard: "1"' /tmp/silo.yaml
          grep -q 'SILO Object Storage Overview' /tmp/silo.yaml
          grep -q 'alert: SiloDriveOffline' /tmp/silo.yaml
          grep -q 'alert: SiloCapacityCritical' /tmp/silo.yaml
          grep -q 'minio_api_requests_total' /tmp/silo.yaml
          grep -q 'minio_cluster_health_nodes_online_count' /tmp/silo.yaml

  build:
    needs: static-validation
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build offline installer from pinned SILO source
        run: |
          chmod +x build-silo.sh install-silo.sh scripts/silo-mc-smoke.sh
          ./build-silo.sh --arch "${{ matrix.arch }}"
      - name: Verify server and legacy mc compatibility entrypoint
        run: |
          image="archinfra-payload/silo:$(cat VERSION)-${{ matrix.arch }}"
          docker run --rm --platform "linux/${{ matrix.arch }}" --entrypoint /usr/bin/silo "${image}" --version
          docker run --rm --platform "linux/${{ matrix.arch }}" --entrypoint /usr/bin/mc "${image}" --version
          docker run --rm --platform "linux/${{ matrix.arch }}" --entrypoint /usr/bin/mc "${image}" cp --help >/dev/null
      - name: Verify installer checksum
        run: |
          cd dist
          sha256sum -c *.run.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: silo-cluster-installer-${{ matrix.arch }}
          path: |
            dist/silo-cluster-installer-*.run
            dist/silo-cluster-installer-*.run.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/silo-v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
